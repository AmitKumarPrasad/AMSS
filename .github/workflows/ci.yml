name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build production container
        run: docker build --tag amss:ci .
      - name: Validate launch compose
        run: docker compose config
        env:
          OPENAI_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      - name: Smoke test application launch
        run: |
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d --build app
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app
          docker compose logs --no-color postgres redis
          exit 1
        env:
          OPENAI_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall .
