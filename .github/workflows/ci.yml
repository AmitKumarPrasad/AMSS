name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B test package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Validate Kubernetes deployment manifests
        run: |
          kubectl kustomize k8s > /tmp/amss-k8s.yaml
          test -s /tmp/amss-k8s.yaml
          python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/amss-k8s.yaml").read_text()
          required = [
              "kind: Deployment",
              "kind: StatefulSet",
              "kind: Service",
              "kind: PodDisruptionBudget",
              "path: /actuator/health/readiness",
              "path: /actuator/health/liveness",
              "failureThreshold: 30",
              "initialDelaySeconds: 30",
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"',
              "prometheus.io/scrape: \"true\"",
              "prometheus.io/path: /actuator/prometheus",
              "prometheus.io/port: \"8080\"",
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f"Missing Kubernetes contract fragments: {missing}"

          redis_commands = [line.strip() for line in text.splitlines() if line.strip() == "- redis-cli"]
          redis_pings = [line.strip() for line in text.splitlines() if line.strip() == "- ping"]
          assert len(redis_commands) >= 2 and len(redis_pings) >= 2, "Redis readiness/liveness commands missing"
          print("Kubernetes deployment, availability, health-probe and observability contracts validated.")
          PY
      - name: Validate PostgreSQL backup and restore tooling
        run: |
          docker run -d --name amss-postgres-backup-test \
            -e POSTGRES_DB=edusphere \
            -e POSTGRES_USER=edusphere \
            -e POSTGRES_PASSWORD=edusphere \
            postgres:17-alpine
          cleanup() { docker rm -f amss-postgres-backup-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if docker exec amss-postgres-backup-test pg_isready -U edusphere -d edusphere >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec amss-postgres-backup-test psql -U edusphere -d edusphere -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_contract_test (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO backup_contract_test VALUES (1, 'restorable');"
          docker cp scripts/postgres-backup.sh amss-postgres-backup-test:/tmp/postgres-backup.sh
          docker cp scripts/postgres-restore.sh amss-postgres-backup-test:/tmp/postgres-restore.sh
          docker exec -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=edusphere -e PGDATABASE=edusphere -e PGPASSWORD=edusphere amss-postgres-backup-test sh /tmp/postgres-backup.sh /tmp/edusphere.dump
          docker exec amss-postgres-backup-test psql -U edusphere -d edusphere -v ON_ERROR_STOP=1 -c "DROP TABLE backup_contract_test;"
          docker exec -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=edusphere -e PGDATABASE=edusphere -e PGPASSWORD=edusphere amss-postgres-backup-test sh /tmp/postgres-restore.sh /tmp/edusphere.dump
          restored=$(docker exec amss-postgres-backup-test psql -U edusphere -d edusphere -tAc "SELECT value FROM backup_contract_test WHERE id=1;")
          test "$restored" = "restorable" || { echo "Backup restore verification failed: $restored"; exit 1; }
          echo "PostgreSQL backup/restore contract validated successfully."
      - name: Build production container
        run: docker build --tag amss:ci .
      - name: Validate production image hardening
        run: |
          image_user=$(docker image inspect amss:ci --format '{{.Config.User}}')
          test "$image_user" = "10001" || { echo "Expected image user 10001, got: $image_user"; exit 1; }
          healthcheck=$(docker image inspect amss:ci --format '{{json .Config.Healthcheck}}')
          echo "Image user: $image_user"
          echo "Image healthcheck: $healthcheck"
          echo "$healthcheck" | grep -F '/actuator/health/liveness' >/dev/null || { echo "Liveness healthcheck missing from image"; exit 1; }
          echo "Production image hardening contract validated."
      - name: Validate release readiness documentation
        run: |
          test -s docs/RELEASE_READINESS.md
          grep -F '## Repository readiness' docs/RELEASE_READINESS.md >/dev/null
          grep -F '## Environment-specific launch checklist' docs/RELEASE_READINESS.md >/dev/null
          grep -F '## Frontend transition' docs/RELEASE_READINESS.md >/dev/null
          echo "Backend release-readiness boundary documented and validated."
      - name: Validate launch compose
        run: docker compose config
        env:
          OPENAI_API_KEY: ci-placeholder
          JWT_SECRET: ci-test-jwt-9f4c2a7e6b1d8c3f0a5e7b2d9c4f6a1e
          JWT_ISSUER: http://localhost:8080
      - name: Smoke test application launch
        run: |
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d --build app
          for attempt in {1..150}; do
            if curl --fail --silent http://localhost:8080/actuator/health/liveness > /tmp/liveness.json; then
              echo "Application HTTP server is live."
              cat /tmp/liveness.json
              echo "Validating readiness contract..."
              curl --fail --silent http://localhost:8080/actuator/health/readiness > /tmp/readiness.json
              cat /tmp/readiness.json
              echo "Readiness contract validated: HTTP 200."

              echo "Validating Prometheus metrics contract..."
              curl --fail --silent http://localhost:8080/actuator/prometheus > /tmp/prometheus.txt
              grep -F 'jvm_memory_used_bytes' /tmp/prometheus.txt >/dev/null || { echo "Expected JVM metric missing"; exit 1; }
              echo "Prometheus metrics contract validated: HTTP 200 and JVM metrics exposed."

              echo
              echo "Validating authentication contract..."
              protected_status=$(curl --silent --output /tmp/protected.json --write-out "%{http_code}" http://localhost:8080/api/v1/schools/00000000-0000-0000-0000-000000000001/ai/conversations)
              test "$protected_status" = "401" || { echo "Expected protected endpoint HTTP 401, got $protected_status"; cat /tmp/protected.json; exit 1; }
              login_status=$(curl --silent --output /tmp/login.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"username":"","password":""}' http://localhost:8080/api/v1/auth/login)
              test "$login_status" = "400" || { echo "Expected invalid login HTTP 400, got $login_status"; cat /tmp/login.json; exit 1; }
              echo "Authentication contract validated: protected API returns 401 and malformed login returns 400."

              echo "Validating OpenAPI contract..."
              curl --fail --silent http://localhost:8080/v3/api-docs > /tmp/openapi.json
              python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("/tmp/openapi.json").read_text())
          assert document.get("openapi"), "OpenAPI version is missing"
          assert document.get("info", {}).get("title") == "EduSphere / AMSS API", "Unexpected OpenAPI title"
          assert document.get("info", {}).get("version") == "v1", "Unexpected OpenAPI version"
          paths = document.get("paths", {})
          required = {
              "/api/v1/auth/login",
              "/api/v1/schools/{schoolId}/ai/ask",
              "/api/v1/schools/{schoolId}/ai/conversations",
          }
          missing = sorted(required - paths.keys())
          assert not missing, f"Required API paths missing: {missing}"
          print(f"OpenAPI contract validated: {len(paths)} paths exposed.")
          PY
              exit 0
            fi
            if (( attempt % 10 == 0 )); then
              echo "Application not live after $((attempt * 2))s"
              docker compose ps
            fi
            sleep 2
          done
          docker compose ps
          echo "Final liveness response:"
          curl --silent --show-error http://localhost:8080/actuator/health/liveness || true
          echo
          echo "Final readiness response:"
          curl --silent --show-error http://localhost:8080/actuator/health/readiness || true
          echo
          docker compose logs --no-color app
          docker compose logs --no-color postgres redis
          exit 1
        env:
          OPENAI_API_KEY: ci-placeholder
          JWT_SECRET: ci-test-jwt-9f4c2a7e6b1d8c3f0a5e7b2d9c4f6a1e
          JWT_ISSUER: http://localhost:8080
          SPRING_PROFILES_ACTIVE: prod
          SPRING_AI_MCP_SERVER_ENABLED: "false"
          NOTIFICATIONS_EMAIL_ENABLED: "false"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall .
