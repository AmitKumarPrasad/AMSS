services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edusphere}
      POSTGRES_USER: ${POSTGRES_USER:-edusphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edusphere}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_AI_MCP_SERVER_ENABLED: ${SPRING_AI_MCP_SERVER_ENABLED:-true}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-edusphere}
      DB_USERNAME: ${POSTGRES_USER:-edusphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-edusphere}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the app}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random secret before starting the app}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER before starting the app}
      DOCUMENT_STORAGE_PROVIDER: local
      DOCUMENT_STORAGE_ROOT: /app/data/documents
      AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8123
      LANGGRAPH_BASE_URL: http://ai-orchestrator:8123
      AI_ORCHESTRATOR_SERVICE_TOKEN: ${AI_ORCHESTRATOR_SERVICE_TOKEN:?Set AI_ORCHESTRATOR_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_DEMO_USERNAME: ${APP_DEMO_USERNAME:-demo-admin}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      NOTIFICATIONS_EMAIL_ENABLED: "false"
    volumes:
      - documents_data:/app/data/documents
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/liveness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ai-orchestrator:
    build:
      context: ./ai-orchestrator
      dockerfile: Dockerfile
    ports: ["127.0.0.1:8123:8123"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY before starting the stack}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6}
      SPRING_MCP_URL: http://app:8080/mcp
      AI_ORCHESTRATOR_SERVICE_TOKEN: ${AI_ORCHESTRATOR_SERVICE_TOKEN:?Set AI_ORCHESTRATOR_SERVICE_TOKEN}
      ALLOW_INSECURE_MCP_HTTP: "true"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  documents_data:
