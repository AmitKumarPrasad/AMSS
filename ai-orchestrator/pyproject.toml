[project]
name = "edusphere-ai-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration service for EduSphere school AI"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<1.0",
  "langchain-openai>=0.3,<1.0",
  "langchain-mcp-adapters>=0.1,<1.0",
  "langchain-core>=0.3,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
